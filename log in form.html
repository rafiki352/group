<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Log in here</title>
    <style>
    body {
        background-color: rgb(0, 38, 255);
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
        background: tomato;
      padding: 20px;
      border: 1px solid #a3ee17;
      border-radius: 10px;
      width: 250px;
      opacity: calc(1.5);
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
    }

    button {
      width: 100%;
      padding: 8px;
      background: rgb(65, 175, 65);
      color: white;
      border: none;
    }
    h3{
        text-align: center;
        color: rgb(204, 136, 147);
    }
  </style>
</head>
<body>
<div class="login-box">
    <h3>Login</h3>

    <input type="text" placeholder="Email">
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button>Login</button>
  </div>
    
</body>
</html>
